[package]
name = "feathersheet-ponte"
version = "0.0.1"
edition = "2021"
description = "A camada de comandos: o TypeScript pede, a pasta viva no Rust responde."

# A camada de comandos é onde o JSON mora (regra 11: o `feathersheet-core` não
# ganha dependência; o que precisa de crate fica aqui ou no `feathersheet-io`).
#
# Não depende do `feathersheet-io` de propósito: este crate também vira
# `.wasm` para os testes do TypeScript rodarem contra o motor de verdade, e o
# Arrow não precisa ir junto. Quem abre e grava arquivo é o `src-tauri`, que
# entrega a pasta pronta para cá.
[dependencies]
feathersheet-core = { path = "../feathersheet-core" }
feathersheet-io = { path = "../feathersheet-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[lib]
name = "feathersheet_ponte"
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "s"

